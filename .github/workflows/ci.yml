name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 python3-pil
      - name: Parse Lua
        run: find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Run regression suite
        run: lua5.4 tests/run.lua
      - name: Verify generated item catalog and artwork
        run: |
          lua5.4 scripts/generate_items.lua --check
          python3 scripts/process_item_assets.py --check
      - name: Verify release version contract
        run: lua5.4 scripts/check_version.lua
      - name: Check whitespace
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD
      - name: Scan tracked files for common secrets
        run: |
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|discord(app)?\.com/api/webhooks/[0-9]+/|mysql://[^[:space:]]+:[^[:space:]]+@)' -- . ':!tests/run.lua' ':!.github/workflows/ci.yml'; then
            echo "Potential secret found in tracked files."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Test Sites worker artifact
        run: npm run test:sites

  minigames-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minigames-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: minigames-ui/package-lock.json
      - name: Install minigame dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test minigames
        run: npm test
      - name: Build FiveM NUI
        run: npm run build

  inspection-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inspection-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inspection-ui/package-lock.json
      - name: Install inspection HUD dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test inspection HUD and shell contract
        run: npm test
      - name: Build inspection HUD NUI
        run: npm run build
